<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>og-kort</title>
<style>
  html,body{margin:0;padding:0}
  body{
    width:1200px;height:630px;background:#08080a;color:#f3f1ec;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;position:relative;overflow:hidden;
  }
  .glow{position:absolute;inset:0;background:radial-gradient(90% 70% at 15% 0%,rgba(255,47,47,.18),transparent 60%)}
  .frame{
    position:absolute;inset:44px;border:1px solid #232326;
    padding:34px 44px 38px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .top{display:flex;justify-content:space-between;align-items:center;
    font:500 14px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8f8d88}
  .dot{width:10px;height:10px;border-radius:50%;background:#ff2f2f;display:inline-block;margin-right:12px}
  h1{font-size:136px;line-height:.84;letter-spacing:-.055em;font-weight:600;margin:0 0 8px}
  h1 em{font-family:Georgia,serif;font-style:italic;font-weight:400;color:#ff2f2f;letter-spacing:-.03em}
  .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
  .claim{font-size:23px;line-height:1.45;color:#a9a6a1;max-width:600px}
  .claim b{color:#f3f1ec;font-weight:600}
  .stamp{font:500 13px/1.6 ui-monospace,Menlo,monospace;color:#6a6864;letter-spacing:.1em;text-align:right;text-transform:uppercase;white-space:nowrap}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="frame">
    <div class="top">
      <span><span class="dot"></span>SE-ALERT · NATIONELLT TEST</span>
      <span>T–12</span>
    </div>
    <h1>DÖP<br><em>larmet</em></h1>
    <div class="bottom">
      <p class="claim">7 december 2026 · 15:00<br><b>Hela Sveriges telefoner. Samtidigt.</b><br>Larmet har inget namn. Det ska få ett.</p>
      <p class="stamp">opensverige.se<br>inte en myndighet</p>
    </div>
  </div>
</body>
</html>
